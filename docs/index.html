<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pronostics du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1419;
    --surface: #161C26;
    --surface-2: #1D2530;
    --line: #262F3B;
    --text: #E8ECEF;
    --muted: #7C8A99;
    --accent-high: #4FD1C5;
    --accent-mid: #E0B84F;
    --accent-low: #E8674F;
    --market-above: #E8674F;
    --market-below: #5B9BD5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 0 0 4rem;
  }
  header {
    padding: 3rem 1.5rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--accent-high);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0.4rem 0 0.6rem;
    font-weight: 700;
  }
  .meta {
    color: var(--muted);
    font-size: 0.85rem;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }
  .pick {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.1rem 1.3rem;
    margin-bottom: 0.9rem;
  }
  .pick-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
  }
  .rank {
    color: var(--accent-high);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    margin-right: 0.6rem;
  }
  .match {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
  }
  .comp {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .when {
    text-align: right;
    flex-shrink: 0;
  }
  .when .date {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: capitalize;
  }
  .when .time {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
  }
  .selection {
    margin-top: 0.6rem;
    font-size: 0.9rem;
  }
  .selection b { color: var(--accent-high); }
  .row-details {
    display: flex;
    gap: 1.5rem;
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .market-prob {
    font-weight: 600;
  }
  .market-above { color: var(--market-above); }
  .market-below { color: var(--market-below); }
  .h2h-line {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .h2h-char {
    display: inline-block;
    width: 1.1rem;
    height: 1.1rem;
    line-height: 1.1rem;
    text-align: center;
    border-radius: 3px;
    font-weight: 700;
    font-size: 0.68rem;
    margin-left: 0.15rem;
  }
  .h2h-g { background: rgba(79, 209, 197, 0.18); color: var(--accent-high); }
  .h2h-p { background: rgba(232, 103, 79, 0.18); color: var(--accent-low); }
  .h2h-n { background: rgba(224, 184, 79, 0.18); color: var(--accent-mid); }
  .news-line {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .news-line .nb {
    color: var(--text);
    font-weight: 600;
  }
  .odds-best-line {
    margin-top: 0.5rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .odds-best-line b { color: var(--text); }
  .odds-max-value {
    color: var(--accent-high);
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }
  .odds-detail {
    margin-top: 0.35rem;
  }
  .odds-detail summary {
    cursor: pointer;
    color: var(--accent-high);
    font-size: 0.72rem;
    user-select: none;
  }
  .odds-detail summary:hover { opacity: 0.8; }
  .odds-detail-list {
    margin-top: 0.4rem;
    background: var(--surface-2);
    border-radius: 4px;
    padding: 0.5rem 0.7rem;
  }
  .odds-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    padding: 0.2rem 0;
    border-bottom: 1px solid var(--line);
  }
  .odds-row:last-child { border-bottom: none; }
  .gauge-wrap {
    margin-top: 0.8rem;
  }
  .gauge-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  .gauge-track {
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .gauge-fill {
    height: 100%;
    border-radius: 3px;
  }
  .score-num {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
  }
  #status { color: var(--muted); font-size: 0.85rem; }
  footer {
    max-width: 900px;
    margin: 2rem auto 0;
    padding: 0 1.5rem;
    color: var(--muted);
    font-size: 0.72rem;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Pronostics — mise à jour quotidienne</div>
  <h1>Sélections du jour</h1>
  <div class="meta" id="generated-at">Chargement…</div>
</header>

<main id="picks">
  <p id="status">Chargement des données…</p>
</main>

<footer>Généré automatiquement — pipeline GitHub Actions + The Odds API + flux RSS diversifiés.</footer>

<script>
function gaugeColor(score) {
  if (score >= 70) return 'var(--accent-high)';
  if (score >= 50) return 'var(--accent-mid)';
  return 'var(--accent-low)';
}

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('generated-at').textContent =
      'Généré le ' + new Date(data.generated_at_utc).toLocaleString('fr-FR', { timeZone: 'UTC' }) + ' (UTC)';

    const container = document.getElementById('picks');
    container.innerHTML = '';

    if (!data.picks || data.picks.length === 0) {
      container.innerHTML = '<p id="status">Aucune rencontre trouvée pour le moment.</p>';
      return;
    }

    data.picks.forEach((p, idx) => {
      const best = p.best_pick;
      const score = best.confidence_score_pct;
      const marketProb = best.market_probability_pct;
      const marketClass = marketProb > score ? 'market-above' : (marketProb < score ? 'market-below' : '');

      const dt = new Date(p.commence_time_gmt);
      const dateLabel = dt.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
      const timeLabel = dt.toISOString().substring(11, 16) + ' GMT';

      const sourcesLabel = best.news_sources && best.news_sources.length ? best.news_sources : 'aucune source trouvée';

      // Ligne "Meilleure cote" + liste dépliable de tous les bookmakers pour cette sélection
      let bestOddsLine = '';
      if (best.max_bookmaker) {
        const maxTies = best.max_ties || [best.max_bookmaker];
        const tieNote = maxTies.length > 1 ? ` (+${maxTies.length - 1} autre(s) à égalité)` : '';
        const detailRows = (best.odds_detail || [])
          .map(d => `<div class="odds-row"><span>${d.bookmaker}</span><span>${d.odds}</span></div>`)
          .join('');
        bestOddsLine = `
          <div class="odds-best-line">
            Meilleure cote : <b>${best.max_bookmaker}</b> à <span class="odds-max-value">${best.max_odds}</span>${tieNote}
            <details class="odds-detail">
              <summary>Voir toutes les cotes (${(best.odds_detail || []).length})</summary>
              <div class="odds-detail-list">${detailRows}</div>
            </details>
          </div>`;
      }

      // Ligne "Historique face-à-face" (G/N/P du point de vue du favori du marché)
      let h2hLine = '';
      if (p.h2h_nb_matches > 0) {
        const chars = p.h2h_summary.split('').map(c => {
          const cls = c === 'G' ? 'h2h-g' : (c === 'P' ? 'h2h-p' : 'h2h-n');
          return `<span class="h2h-char ${cls}">${c}</span>`;
        }).join('');
        h2hLine = `
          <div class="h2h-line">
            Historique face-à-face (${p.h2h_nb_matches}, favori: ${p.h2h_favorite}) : ${chars}
          </div>`;
      }

      const el = document.createElement('div');
      el.className = 'pick';
      el.innerHTML = `
        <div class="pick-top">
          <div>
            <span class="rank">#${idx + 1}</span>
            <span class="match">${p.match}</span>
            <div class="comp">${p.sport} · ${p.country}</div>
          </div>
          <div class="when">
            <div class="date">${dateLabel}</div>
            <div class="time">${timeLabel}</div>
          </div>
        </div>
        <div class="selection">Sélection suggérée : <b>${best.selection}</b> — ${best.type} (cote ${best.odds})</div>
        <div class="row-details">
          <span>Bookmakers pris en compte : ${p.nb_bookmakers}</span>
          <span>Probabilité marché : <span class="market-prob ${marketClass}">${marketProb}%</span></span>
        </div>
        ${bestOddsLine}
        ${h2hLine}
        <div class="news-line">
          <span class="nb">${best.news_nb_articles}</span> article(s) d'actualité trouvé(s) — sources : ${sourcesLabel}
        </div>
        <div class="gauge-wrap">
          <div class="gauge-label">
            <span>Score de confiance</span>
            <span class="score-num" style="color:${gaugeColor(score)}">${score}%</span>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill" style="width:${score}%; background:${gaugeColor(score)}"></div>
          </div>
        </div>
      `;
      container.appendChild(el);
    });
  })
  .catch(err => {
    document.getElementById('picks').innerHTML =
      '<p id="status">Pas encore de données — le premier run automatique n\'a pas encore eu lieu.</p>';
    console.error(err);
  });
</script>

</body>
</html>
