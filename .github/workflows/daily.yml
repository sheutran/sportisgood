name: Daily betting analysis

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC chaque jour
  workflow_dispatch: {}     # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'analyse
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPORT_KEYS: "soccer_epl,soccer_france_ligue_one,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_uefa_champs_league_qualification,soccer_usa_mls,basketball_nba,basketball_wnba,americanfootball_nfl,americanfootball_nfl_preseason,baseball_mlb,tennis_atp_cincinnati_open,tennis_wta_cincinnati_open,mma_mixed_martial_arts,boxing_boxing"
          MAX_EVENTS: "20"
          HOURS_AHEAD: "24"
          MAX_RSS_FEEDS: "15"
        run: python main.py

      - name: Commit et push du data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Mise a jour quotidienne des pronostics"
          git pull --rebase origin master
          git push
